<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vane Helper</title>
    <link rel="stylesheet" href="ui/theme.css">
    <style>
        :root {
            --tile-size: 100px;
            --gap: 8px;
            --cols: 3;
        }
        body {
            /* Grid columns + gaps + the grid's own 16px side padding. */
            width: calc(var(--cols) * var(--tile-size) + (var(--cols) - 1) * var(--gap) + 32px);
            padding: 0;
            background:
                radial-gradient(120% 80% at 50% -10%, var(--accent-soft) 0%, transparent 60%),
                var(--bg);
        }

        /* ---------- Header ---------- */
        .header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 16px 16px 12px;
        }
        .brand-mark {
            width: 32px;
            height: 32px;
            border-radius: 10px;
            display: grid;
            place-items: center;
            background: var(--accent);
            color: var(--accent-text);
            font-weight: 700;
            font-size: 0.95rem;
            letter-spacing: -0.02em;
            box-shadow: var(--shadow-md);
        }
        .brand-text {
            display: flex;
            flex-direction: column;
            line-height: 1.2;
        }
        .brand-title {
            font-size: 0.95rem;
            font-weight: 650;
            letter-spacing: -0.01em;
        }
        .brand-sub {
            font-size: 0.72rem;
            color: var(--text-faint);
        }

        /* ---------- Feature grid ---------- */
        .grid {
            display: grid;
            grid-template-columns: repeat(var(--cols), var(--tile-size));
            gap: var(--gap);
            padding: 4px 12px 16px;
            justify-content: center;
        }
        .tile {
            width: var(--tile-size);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            gap: 10px;
            border: none;
            background: none;
            cursor: pointer;
            padding: 12px 6px;
            transition: transform 0.16s cubic-bezier(.2,.8,.3,1);
        }
        .tile:hover { transform: translateY(-2px); }
        .tile:focus-visible { outline: none; }
        .tile:active { transform: translateY(0) scale(.96); }
        .tile:disabled {
            opacity: 0.45;
            cursor: default;
            transform: none;
        }
        .tile:disabled:hover { transform: none; }
        .tile:disabled:hover .icon,
        .tile:disabled:focus-visible .icon { transform: none; }
        .tile:disabled:hover .icon::before,
        .tile:disabled:focus-visible .icon::before { opacity: 0; }
        .tile .icon {
            position: relative;
            width: 56px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent);
            transition: transform 0.18s cubic-bezier(.2,.8,.3,1);
        }
        /* Hover indicator: a soft accent glow blooms out from behind the icon.
           No card, border or box — the glyph itself carries the emphasis. */
        .tile .icon::before {
            content: '';
            position: absolute;
            inset: -10px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--accent-soft) 0%,
                        color-mix(in srgb, var(--accent) 16%, transparent) 55%, transparent 72%);
            opacity: 0;
            transform: scale(.6);
            transition: opacity 0.2s ease, transform 0.2s cubic-bezier(.2,.8,.3,1);
            pointer-events: none;
        }
        .tile:hover .icon,
        .tile:focus-visible .icon { transform: scale(1.12); }
        .tile:hover .icon::before,
        .tile:focus-visible .icon::before { opacity: 1; transform: scale(1); }
        .tile .icon svg {
            position: relative;
            width: 100%;
            height: 100%;
            display: block;
            object-fit: contain;
        }
        .tile .icon img {
            position: relative;
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }
        .tile .label {
            font-size: 0.73rem;
            font-weight: 500;
            line-height: 1.25;
            text-align: center;
            color: var(--text-faint);
            transition: color 0.16s ease, font-weight 0.16s ease;
        }
        .tile:hover .label,
        .tile:focus-visible .label {
            color: var(--text);
            font-weight: 600;
        }

        /* ---------- Status ---------- */
        .status {
            margin: 0 16px 12px;
            padding: 0;
            font-size: 0.78rem;
            text-align: center;
            color: var(--text-muted);
            min-height: 1em;
            word-break: break-word;
        }
        .status:not(:empty) {
            padding: 9px 12px;
            border-radius: var(--radius-sm);
            background: var(--surface);
            border: 1px solid var(--border);
        }
        .status.error {
            color: var(--danger);
            border-color: color-mix(in srgb, var(--danger) 35%, transparent);
            background: color-mix(in srgb, var(--danger) 8%, var(--surface));
        }
        .status.success {
            color: var(--success);
            border-color: color-mix(in srgb, var(--success) 35%, transparent);
            background: color-mix(in srgb, var(--success) 8%, var(--surface));
        }

        /* ---------- Footer ---------- */
        .footer {
            padding: 10px 16px 14px;
            border-top: 1px solid var(--border);
        }
        .settings-link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            width: 100%;
            padding: 8px;
            font-size: 0.78rem;
            font-weight: 550;
            color: var(--text-muted);
            cursor: pointer;
            text-decoration: none;
            background: none;
            border: none;
            border-radius: var(--radius-sm);
            transition: background 0.15s ease, color 0.15s ease;
        }
        .settings-link:hover {
            color: var(--accent);
            background: var(--accent-soft);
        }
        .settings-link svg {
            width: 15px;
            height: 15px;
            flex: none;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="brand-mark">V</div>
        <div class="brand-text">
            <span class="brand-title">Vane Helper</span>
            <span class="brand-sub">Your toolkit, one click away</span>
        </div>
    </header>

    <main class="grid" id="grid"></main>

    <div class="status" id="status" role="status" aria-live="polite"></div>

    <div class="footer">
        <button id="settings-link" class="settings-link" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9c.17.61.67 1.04 1.3 1.09H21a2 2 0 1 1 0 4h-.09c-.63.05-1.13.48-1.3 1.09Z"></path>
            </svg>
            Settings
        </button>
    </div>
    <!-- Feature scripts register themselves onto window.__VANE_FEATURES__.
         Add one line per feature, then registry.js finalizes window.FEATURES. -->
    <script src="features/reverse-stories/feature.js"></script>
    <script src="features/registry.js"></script>
    <script src="popup.js"></script>
</body>
</html>
